# Configuration for RM101 gearbox diagnosis on the graph-first mainline.

name: "exp2_rm101"
save_dir: "/home/user/LQ/B_Signal/PHMGA/artifacts/exp2_rm101_slice8"
metadata_path: "/home/user/data/PHMbenchdata/PHM-Vibench/gear_metadata.xlsx"
h5_path: "/home/user/data/PHMbenchdata/PHM-Vibench/RM_101_THU_GEARBOX.h5"
state_save_path: "/home/user/LQ/B_Signal/PHMGA/artifacts/exp2_rm101_slice8/exp2_rm101_built_state.pkl"
report_path: "/home/user/LQ/B_Signal/PHMGA/artifacts/exp2_rm101_slice8/exp2_rm101_final_report.md"
use_window: false

data:
  dataset_name: "RM101"
  metadata_path: "/home/user/data/PHMbenchdata/PHM-Vibench/gear_metadata.xlsx"
  h5_path: "/home/user/data/PHMbenchdata/PHM-Vibench/RM_101_THU_GEARBOX.h5"
  selection:
    dataset_id: 101
    domain_ids: [0, 1, 2]
    drop_invalid_labels: true
  split:
    strategy: stratified_fixed_per_class
    train_per_class: 1
    val_per_class: 1
    test_per_class: 1
    seed: 0
  window:
    window_size: 4096
    stride: 4096
    slice_mode: centered
    drop_last_window: false

ref_ids:
  - 101073
  - 101001
  - 101037
  - 101085
  - 101097
  - 101205
  - 101133
  - 101169

test_ids:
  - 101074
  - 101002
  - 101038
  - 101086
  - 101098
  - 101206
  - 101134
  - 101170

builder:
  graph: executor
  min_depth: 3
  min_width: 2
  max_depth: 3

llm:
  provider: openrouter
  mode: provider
  model: z-ai/glm-4.5-air:free
  api_key_env: OPENROUTER_API_KEY
  timeout_sec: 20
  max_tokens_structured: 800

user_instruction: >
  Analyze the gearbox signals for multi-class fault diagnosis. The reference set contains
  eight gearbox health states across different operating conditions. The test set contains
  one held-out sample for each state. Build a compact but discriminative feature pipeline
  that can support downstream classification and final reporting.
