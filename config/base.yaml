llm:
  provider: openrouter
  mode: offline_stub
  model: z-ai/glm-4.5-air:free
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  timeout_sec: 60
  temperature: 0.0
  max_tokens: 2000

fusion:
  mode: learned_softmax
  fixed_weights: {}
  learning_rate: 0.01
  epochs: 8

runtime:
  action: run
  max_iterations: 4
  min_depth: 3
  min_width: 1
  max_depth: 8
  output_dir: null
