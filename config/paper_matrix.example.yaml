matrix:
  llm:
    - name: openrouter_gpt4omini
      env:
        LLM_PROVIDER: openrouter
        QUERY_GENERATOR_MODEL: openai/gpt-4o-mini
        PHM_MODEL: openai/gpt-4o-mini
        REFLECTION_MODEL: openai/gpt-4o-mini
        ANSWER_MODEL: openai/gpt-4o-mini
    - name: openrouter_claude_sonnet
      env:
        LLM_PROVIDER: openrouter
        QUERY_GENERATOR_MODEL: anthropic/claude-3.5-sonnet
        PHM_MODEL: anthropic/claude-3.5-sonnet
        REFLECTION_MODEL: anthropic/claude-3.5-sonnet
        ANSWER_MODEL: anthropic/claude-3.5-sonnet

  datasets:
    - name: ottawa
      case_config: config/tspn_case_exp_ottawa.yaml
    - name: rm101
      case_config: config/case_exp_gearbox_rm101.yaml

  ablations:
    - name: A0_full
      mode: full
    - name: A1_no_reflect
      mode: no_reflect
    - name: A2_no_prior
      mode: no_prior

runtime:
  conda_env: agent
  use_conda_run: true
  run_preflight: true
  continue_on_error: true
  skip_existing: false
  default_train_backend: tspn
  allow_test_labels_for_reporting: true

  # 在线运行默认
  fake_llm: false
  report_mode: auto
