model:
  name: tspn
  device: cpu
  num_classes: 8
  in_dim: 4096
  in_channels: 8
  out_channels: 4
  scale: 4
  skip_connection: true

  wf_init:
    f_c_mu: 0.0
    f_c_sigma: 0.1
    f_b_mu: 0.0
    f_b_sigma: 0.1

  norm_init:
    method: z_score

  stft_init:
    n_fft: 256
    hop_length: 128

  preserve_topology: true
  allow_duplicate_tokens: true
  unsupported_policy: drop

  layers:
    - gate_temperature: 1.0
      ops:
        - token: I
        - token: WF
        - token: HT
        - token: FFT
    - gate_temperature: 1.0
      ops:
        - token: I
        - token: NORM
        - token: STFT
        - token: WF
    - gate_temperature: 1.0
      ops:
        - token: I
        - token: FFT
        - token: HT
        - token: WF

  features: [Mean, Std, RMS, Kurtosis, SpectralKurtosis]
  disabled_ops: {}

train:
  seed: 42
  epochs: 40
  batch_size: 16
  lr: 5.0e-4
  weight_decay: 1.0e-4
  val_ratio: 0.2
  patience: 12
  grad_clip_norm: 1.0
  use_weighted_sampler: true
  scheduler: cosine
  label_smoothing: 0.05
  early_stop_metric: val_macro_f1
  l1_gate: 1.0e-4
  entropy_gate: 0.0

  debug: false
  debug_max_samples: 64
  debug_epochs: 1

explain:
  topk_ops: 5
  save_wavefilters: true

meta:
  note: "RM101 deep profile for D2 recovery."
