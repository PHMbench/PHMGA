# @package _global_
defaults:
  - override /data: ottawa
  - override /experiment: torch
  - _self_

data:
  split:
    strategy: stratified_fixed_per_class
    seed: 17
    train_per_class: 2
    val_per_class: 1
    test_per_class: 1
  window:
    window_size: 32768
    stride: 16384
    slice_mode: centered
    drop_last_window: false

evaluation:
  dag_quality:
    use_proxy_probe: false

model:
  torch:
    epochs: 1
    phase: compiled
    output_policy: terminal_only
