# @package _global_
defaults:
  - override /data: ottawa
  - override /experiment: ml
  - _self_

llm:
  mode: provider
  provider: bigmodel
  model: glm-4.7-flash
  api_key_env: BIGMODEL_API_KEY
  max_tokens_structured: 2000

runtime:
  workflow_mode: rich
  max_iterations: 4
  min_depth: 3
  min_width: 1
  max_depth: 8
  output_dir: artifacts/paper/ottawa_ml_bigmodel_glm47_v1
