defaults:
  # Root default stays a smoke/development baseline.
  # Paper mainline is frozen by config/runs/*.yaml, not by this file.
  - optional data: null
  - optional experiment: null
  - model: default
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

project:
  name: PHMGA
  version: journal_thesis_rebuild

llm:
  # Root baseline only carries transport/runtime defaults.
  # Formal paper runs must freeze provider/model via config/runs/*.yaml.
  provider: codex_cli
  mode: offline_stub
  model: gpt-5.3-codex
  api_key_env: ""
  base_url: ""
  timeout_sec: 300
  temperature: 0.0
  max_tokens_structured: 800
  max_tokens_report: 2000
  http_referer: null
  app_title: PHMGA

model:
  ml:
    algorithm: logistic_regression
    max_iter: 200
    output_policy: terminal_only
  torch:
    phase: compiled
    epochs: 12
    learning_rate: 0.2
    hidden_dim: 8
    device: auto
    output_policy: terminal_only
    module_runtime:
      enabled: false
    control:
      default_mode: fixed
      tau: 1.0
      attention_heads: 1
      attention_dropout: 0.0

runtime:
  action: run_case
  output_dir: null
  max_iterations: 4
  provider_retry_once: true

evaluation:
  dag_quality:
    enabled: true
    use_proxy_probe: null
    proxy_subset_per_split: 8

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
