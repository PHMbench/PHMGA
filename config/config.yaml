project:
  name: PHMGA
  version: journal_thesis_rebuild

defaults:
  dataset: rm101
  graph_path: dag_only

llm:
  provider: openrouter
  mode: offline_stub

artifacts:
  keep:
    - dag_json
    - compiled_manifest
    - final_report

model:
  ml:
    algorithm: logistic_regression
    max_iter: 200
  torch:
    epochs: 12
    learning_rate: 0.2
    hidden_dim: 8
